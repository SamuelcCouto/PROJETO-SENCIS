<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sencis">
  <!--
    O ícone anterior era a silhueta de um dente. O manual da marca proíbe:
    "nada de dentes, escovas ou clichês visuais... formas orgânicas, suaves,
    e símbolos que evocam equilíbrio e conexão".

    Esta é a lente formada pelo encontro de dois círculos — a interseção,
    ou seja, a conexão — inclinada para não ficar simétrica demais, e
    preenchida com a passagem do azul petróleo para o bege: a mesma
    transição do frio para o quente que a cartela descreve.
  -->
  <defs>
    <linearGradient id="frioQuente" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E93B8"/>
      <stop offset="100%" stop-color="#C9B29B"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#2B2E31"/>
  <path d="M32 9 A 25 25 0 0 1 32 55 A 25 25 0 0 1 32 9 Z"
        fill="url(#frioQuente)"
        transform="rotate(-22 32 32)"/>
</svg>
